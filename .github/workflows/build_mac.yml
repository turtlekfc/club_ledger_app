# 由 build_app.bat 產生。打包邏輯都在 build_tools/build_helper.py，設定在 build_tools/build_config.json
name: Build macOS (club_ledger_app)
# 只在 build_app.bat 的提交 ([build-mac]) 或手動執行時打包，平常 push 不會耗用 macOS 執行時間
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: ./
jobs:
  build-macos:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-mac]')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安裝相依套件 (排除 Windows 專用套件)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(pywin32|pywin32-ctypes|pythonnet|clr[-_]loader|comtypes|pefile|pywinpty|wmi)([=<>~!; \[]|$)' requirements.txt > "$RUNNER_TEMP/req_mac.txt" || true
          pip install pyinstaller pyarmor pillow -r "$RUNNER_TEMP/req_mac.txt"
      - name: 加密並打包
        run: python build_tools/build_helper.py build
      - name: 上傳打包結果
        uses: actions/upload-artifact@v4
        with:
          name: macOS-APP
          path: dist/*-macOS.zip
          if-no-files-found: error
          retention-days: 14
