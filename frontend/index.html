function openAccountModal(id){
  if(!isAdmin()) return;
  const a = id? state.accounts.find(x=>x.id===id) : null;
  // 管理員帳號改成帳冊層級共用（見「帳冊管理員帳號」區塊的 openAdminAccountModal），
  // 這本帳本自己的帳號清單不再提供「管理員」這個角色選項，避免兩邊帳號混在一起、
  // 又各自有一套「至少留一個管理員」的防呆邏輯互相打架。如果正在編輯的是舊版
  // 還沒升級、角色仍是「管理員」的帳號，保留這個選項，避免下拉選單找不到目前
  // 的值而悄悄把角色改掉。
  const roles = Object.keys(ROLE_PRESETS).filter(r=> r!=='管理員' || (a && a.role==='管理員'));
  const allowed = a? (a.allowedTabs||ALL_TAB_IDS) : ROLE_PRESETS['會計'].allowedTabs;
  const tabChecks = ALL_TAB_IDS.map(id2=>`<label><input type="checkbox" class="accTabChk" value="${id2}" ${allowed.includes(id2)?'checked':''}> ${TAB_LABELS[id2]}</label>`).join('');
  showModal(`
    <h3 class="serif">${a? '編輯帳號':'新增帳號'}</h3>
    <div class="form-grid">
      <div><label>姓名</label><input class="input" style="width:100%" id="accName" value="${a?escapeHtml(a.displayName):''}"></div>
      <div><label>登入帳號</label><input class="input" style="width:100%" id="accUser" value="${a?escapeHtml(a.username):''}"></div>
      <div><label>角色</label><select class="input" style="width:100%" id="accRole" onchange="accApplyPreset()">${roles.map(r=>`<option ${a&&a.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
      <div><label><input type="checkbox" id="accCanEdit" ${a? (a.canEdit?'checked':'') : ''}> 允許編輯帳目/專案/部門</label></div>
      ${state.config.features.advance? `<div><label><input type="checkbox" id="accCanReimburse" ${a? (a.canReimburse?'checked':'') : 'checked'}> 允許執行歸墊</label></div>`:''}
      ${state.config.features.dualBook? `<div><label><input type="checkbox" id="accCanViewInternal" ${a? (a.canViewInternal!==false?'checked':'') : 'checked'}> 可檢視內帳（實際金額）</label></div>`:''}
      <div class="full"><label>可看到的選單</label><div class="checklist" id="accTabChecks">${tabChecks}</div></div>
      <div class="full"><label>${a?'重設密碼（留空則不變更）':'密碼（至少4碼）'}</label><input class="input" style="width:100%" type="password" id="accPw"></div>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveAccount(${a?`'${a.id}'`:'null'})">儲存</button></div>
  `);
}
function accApplyPreset(){
  const role = document.getElementById('accRole').value;
  const preset = ROLE_PRESETS[role] || ROLE_PRESETS['其他'];
  document.getElementById('accCanEdit').checked = preset.canEdit;
  const rb = document.getElementById('accCanReimburse'); if(rb) rb.checked = preset.canReimburse;
  const vi = document.getElementById('accCanViewInternal'); if(vi) vi.checked = preset.canViewInternal;
  document.querySelectorAll('.accTabChk').forEach(chk=>{ chk.checked = preset.allowedTabs.includes(chk.value); });
}
async function saveAccount(id){
  if(!isAdmin()) return; // 防禦性檢查：這個函式只應該從「帳號與權限」子頁（已限管理員）觸發
  const name = document.getElementById('accName').value.trim();
  const user = document.getElementById('accUser').value.trim();
  const role = document.getElementById('accRole').value;
  const canEditVal = document.getElementById('accCanEdit').checked;
  const rb = document.getElementById('accCanReimburse'); const canReimburseVal = rb? rb.checked : (role==='管理員'||role==='會計'||role==='出納'||role==='指導老師');
  const vi = document.getElementById('accCanViewInternal'); const canViewInternalVal = vi? vi.checked : true;
  const allowedTabsVal = Array.from(document.querySelectorAll('.accTabChk:checked')).map(c=>c.value);
  const pw = document.getElementById('accPw').value;
  if(!name || !user){ alert('請輸入姓名與帳號'); return; }
  if(!id && pw.length<MIN_PASSWORD_LENGTH){ alert(`新帳號密碼至少${MIN_PASSWORD_LENGTH}碼`); return; }
  // 編輯既有帳號時，如果有填密碼（代表要重設），同樣要套用最短長度限制——
  // 原本這條檢查只在「新增帳號」(!id) 時執行，編輯既有帳號改密碼完全沒有
  // 長度限制，等於「新帳號至少4碼」這條規則改密碼時形同虛設。
  if(id && pw && pw.length<MIN_PASSWORD_LENGTH){ alert(`新密碼至少${MIN_PASSWORD_LENGTH}碼`); return; }
  if(state.accounts.some(a=>a.username===user && a.id!==id)){ alert('此登入帳號已被使用'); return; }
  // 編輯既有帳號時，如果這個帳號目前是「管理員」、而且是全帳本唯一的管理員，
  // 不允許把它改成別的角色——否則會變成整本帳本沒有任何管理員帳號可以登入
  // 處理（見「萬一帳號全部卡住」的緊急救援工具，那就是用來補救這種情況的）。
  if(id){
    const current = state.accounts.find(a=>a.id===id);
    const adminCount = state.accounts.filter(a=>a.role==='管理員').length;
    if(current && current.role==='管理員' && role!=='管理員' && adminCount<=1){
      alert('此帳號是目前唯一的管理員，無法改成其他角色（至少須保留一位管理員帳號）。');
      return;
    }
  }
  let data = { displayName:name, username:user, role, canEdit:canEditVal, canReimburse:canReimburseVal, canViewInternal:canViewInternalVal, allowedTabs: allowedTabsVal.length? allowedTabsVal : ['dashboard'] };
  if(pw){ data.passwordHash = await hashPw(pw); }
  if(id){ const idx = state.accounts.findIndex(a=>a.id===id); state.accounts[idx] = {...state.accounts[idx], ...data}; }
  else state.accounts.push({ id: uid(), ...data });
  await sSet('accounts', state.accounts);
  closeModal(); renderTab();
}
async function deleteAccount(id){
  if(!isAdmin()) return; // 防禦性檢查：這個函式只應該從「帳號與權限」子頁（已限管理員）觸發
  const target = state.accounts.find(a=>a.id===id);
  if(!target) return;
  const adminCount = state.accounts.filter(a=>a.role==='管理員').length;
  if(target.role==='管理員' && adminCount<=1){ alert('至少須保留一位管理員帳號'); return; }
  if(!confirm('確定刪除此帳號？')) return;
  state.accounts = state.accounts.filter(a=>a.id!==id);
  await sSet('accounts', state.accounts); renderTab();
}

/* ============ Modal helper ============ */
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
// 編輯視窗刻意不做「點擊灰色背景關閉」——原本這個行為太容易在滑鼠移動/點選
// 旁邊時誤觸，正在填寫的內容會直接消失、沒有任何確認，使用者體感上像是
// 「視窗很不穩定」。現在只能透過視窗裡明確的「取消」／「儲存」按鈕關閉，
// 避免誤觸造成編輯內容遺失。

init();
</script>
