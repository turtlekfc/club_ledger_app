<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社團帳本</title>
<style>
:root{
  --ink:#1f2a24; --ink-soft:#5b6a61;
  --paper:#f6f4ec; --paper-line:#e2dcc4;
  --cover:#26392f; --cover-soft:#1c2b23;
  --gold:#b8923e; --gold-soft:#efe3c2;
  --rose:#9c4237; --rose-soft:#f1ddd8;
  --blue:#3a5a78; --blue-soft:#dbe6ee;
  --card:#ffffff; --shadow: 0 1px 3px rgba(31,42,36,0.10);
  --radius: 3px;
  --font-body:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  --font-heading:"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif;
}
html[data-theme="dark"]{
  --ink:#e8e5db; --ink-soft:#9aa39a;
  --paper:#1a221d; --paper-line:#33403a;
  --cover:#0f1713; --cover-soft:#0a100d;
  --gold-soft:#4a3f22; --rose-soft:#432622;
  --blue-soft:#1f3040;
  --card:#222b25; --shadow: 0 1px 3px rgba(0,0,0,0.4);
}
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea{ background:#222b25; color:var(--ink); border-color:var(--paper-line); }
html[data-paper="on"] .card{
  background-image: repeating-linear-gradient(var(--card), var(--card) 27px, var(--paper-line) 28px);
  background-attachment: local;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
.serif{font-family:var(--font-heading);}
.num{font-variant-numeric: tabular-nums;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;}
hr{border:none;border-top:1px solid var(--paper-line);}
a{color:var(--blue);}

#lockScreen,#ledgerPicker{min-height:100vh;display:flex;align-items:center;justify-content:center;background: radial-gradient(circle at 20% 20%, rgba(184,146,62,0.10), transparent 45%), var(--cover);padding:24px;}
.ledger-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--paper-line);border-radius:var(--radius);margin-bottom:8px;text-align:left;}
.ledger-item .lname{font-weight:600;}
.ledger-item .ldefault{font-size:11px;color:var(--gold);margin-left:6px;}
.lock-card{background:var(--paper);border:1px solid var(--paper-line);border-radius:var(--radius);width:100%;max-width:380px;padding:34px 30px;box-shadow:0 12px 30px rgba(0,0,0,0.3);text-align:center;}
.lock-card .logowrap{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--gold);}
.lock-card .logowrap img{width:100%;height:100%;object-fit:cover;}
.lock-card .mark{color:var(--gold);font-size:20px;font-weight:600;}
.lock-card h1{font-size:19px;margin:0 0 4px;}
.lock-card p.sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
.lock-card input,.lock-card select{width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--card);margin-bottom:9px;}
.lock-card button.primary{width:100%;padding:11px;border:none;border-radius:var(--radius);background:var(--cover);color:#fff;font-weight:600;font-size:14px;margin-top:4px;}
.lock-card .err{color:var(--rose);font-size:12.5px;min-height:16px;margin-top:4px;}
.lock-card .hint{font-size:11.5px;color:var(--ink-soft);margin-top:14px;}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;display:inline-block;border:2px solid transparent;margin:2px;}
.swatch.on{border-color:var(--ink);}

#app{display:none;min-height:100vh;flex-direction:column;}
#app.show{display:flex;}
header.cover{background:var(--cover);color:#f3efe2;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
header.cover .brand{display:flex;align-items:center;gap:12px;}
header.cover .logowrap{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold);flex-shrink:0;}
header.cover .logowrap img{width:100%;height:100%;object-fit:cover;}
header.cover .logowrap .ic{color:var(--gold);font-size:14px;}
header.cover h1{font-family:var(--font-heading);font-size:16.5px;margin:0;font-weight:600;letter-spacing:0.5px;}
header.cover .balance{font-size:12.5px;color:#d8cfae;}
header.cover .balance b{color:var(--gold);font-size:14.5px;}
header.cover .right{display:flex;align-items:center;gap:10px;}
header.cover .who{font-size:12px;color:#d8cfae;text-align:right;}
header.cover .who b{color:#fff;}
header.cover .lockbtn{background:transparent;border:1px solid rgba(255,255,255,0.3);color:#f3efe2;padding:6px 12px;border-radius:var(--radius);font-size:12px;}

nav.tabs{display:flex;background:var(--cover-soft);padding:0 16px;gap:2px;overflow-x:auto;}
nav.tabs button{background:transparent;border:none;color:#d8cfae;padding:11px 14px;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:#fff;border-bottom:2px solid var(--gold);font-weight:600;}

main{flex:1;max-width:1140px;width:100%;margin:0 auto;padding:20px 20px 60px;}

.card{background:var(--card);border:1px solid var(--paper-line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.card h2{font-family:var(--font-heading);margin:0 0 4px;font-size:15px;}
.card h3{font-family:var(--font-heading);margin:0 0 8px;font-size:13.5px;}
.card .desc{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px;}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.subtabs button{padding:6px 13px;border-radius:20px;border:1px solid var(--paper-line);background:var(--card);font-size:12.5px;color:var(--ink-soft);}
.subtabs button.active{background:var(--cover);color:#fff;border-color:var(--cover);}

.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--paper-line);border-left:3px solid var(--gold);border-radius:var(--radius);padding:14px 16px;}
.stat.expense{border-left-color:var(--rose);}
.stat.blue{border-left-color:var(--blue);}
.stat .lbl{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.stat .val{font-size:21px;font-weight:700;}
.stat.expense .val{color:var(--rose);}
.stat.income .val{color:#3f6b52;}

.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.btn{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--paper-line);background:var(--card);color:var(--ink);font-size:13px;}
.btn.primary{background:var(--cover);color:#fff;border-color:var(--cover);}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn.danger{color:var(--rose);border-color:var(--rose-soft);}
.btn.small{padding:4px 9px;font-size:12px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
select,.input{padding:8px 10px;border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--card);color:var(--ink);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.ledger thead th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:12px;border-bottom:1px solid var(--ink);padding:8px 8px;}
table.ledger tbody td{padding:9px 8px;border-bottom:1px dashed var(--paper-line);vertical-align:top;}
table.ledger tbody tr:hover{background:#fbfaf5;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--gold-soft);color:#6b5320;}
.tag.exp{background:var(--rose-soft);color:var(--rose);}
.tag.warn{background:#f3e2c4;color:#7a5a1e;}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;background:var(--blue-soft);color:var(--blue);margin:0 3px 3px 0;}
.semchip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;background:#eee6d3;color:#6b5320;margin-left:6px;}
.amt-in{color:#3f6b52;font-weight:600;}
.amt-out{color:var(--rose);font-weight:600;}
.muted{color:var(--ink-soft);}
.masked{letter-spacing:2px;color:var(--ink-soft);}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px;}
.form-grid label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
.form-grid .full{grid-column:1/-1;}
.form-section{margin-bottom:16px;}
.form-section-title{font-size:11.5px;font-weight:700;color:var(--ink-soft);border-bottom:1px solid var(--paper-line);padding-bottom:5px;margin-bottom:9px;letter-spacing:0.5px;}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
.bar-row .lbl{width:120px;flex-shrink:0;color:var(--ink-soft);}
.bar-track{flex:1;background:var(--paper-line);height:9px;border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;background:var(--gold);}
.bar-fill.exp{background:var(--rose);}
.bar-fill.over{background:var(--rose);}
.bar-val{width:100px;text-align:right;flex-shrink:0;}

.empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:13px;}

/* 跳出視窗點擊灰色背景就消失的問題：程式裡沒有任何「點背景關閉視窗」的
   邏輯（closeModal() 只會被取消/關閉按鈕呼叫），依症狀判斷比較像是
   Windows 上 WebView2/Chromium 組合層（compositing layer）的已知顯示瑕疵
   ——半透明的固定定位圖層在某些顯示卡/縮放比例下，點擊時的重繪可能把
   這層「畫丟」。這裡用 transform 把 .modal-bg 強制拉成獨立的 GPU 合成層
   （一般稱為「層提升」，常見的 WebView2/Chromium 瑕疵解法），如果這樣
   還是沒解決，下一步請在 main.py 嘗試關閉 WebView2 的 GPU 加速（見
   README「跳出視窗背景消失」疑難排解一節）。*/
.modal-bg{position:fixed;inset:0;background:rgba(31,42,36,0.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;transform:translateZ(0);will-change:transform;backface-visibility:hidden;}
.modal-bg.show{display:flex;}
.modal{background:var(--paper);border-radius:var(--radius);max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.3);transform:translateZ(0);}
.modal h3{font-family:var(--font-heading);margin:0 0 14px;font-size:16px;}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.member-row,.cat-row,.proj-item,.dept-item,.acc-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--paper-line);gap:8px;}
.proj-item,.dept-item{cursor:pointer;}
.proj-item:hover,.dept-item:hover{background:#fbfaf5;}
.proj-item .pname,.dept-item .dname{font-weight:600;}
.proj-item .ptype{font-size:11px;color:var(--ink-soft);margin-left:6px;}
.proj-item .pnum,.dept-item .dnum{font-size:12.5px;}
.subcat-list{margin:4px 0 10px 14px;padding-left:10px;border-left:2px solid var(--paper-line);}

canvas.sigpad{border:1px solid var(--paper-line);border-radius:var(--radius);background:#fff;touch-action:none;width:100%;max-width:300px;height:110px;}
.sig-block{display:inline-block;margin:0 18px 18px 0;text-align:center;vertical-align:top;}
.sig-block .cap{font-size:12px;color:var(--ink-soft);margin-top:6px;}

.chart-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
.legend{font-size:12.5px;}
.legend .li{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.legend .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

.role-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--blue-soft);color:var(--blue);}
.role-badge.admin{background:var(--gold-soft);color:#6b5320;}
.perm-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#e6efe8;color:#3f6b52;}
.perm-badge.view{background:#f1ece0;color:var(--ink-soft);}

.seal-preview-page{position:relative;width:240px;height:340px;background:#fff;border:1px solid var(--paper-line);margin:10px 0;box-shadow:var(--shadow);}
.seal-preview-page .ln{height:6px;background:#eee;margin:14px 16px;border-radius:2px;}
.seal-preview-page .seal-img{position:absolute;object-fit:contain;pointer-events:none;}

.preset-swatch{display:inline-block;width:120px;padding:10px;border:1px solid var(--paper-line);border-radius:var(--radius);margin:4px 6px 4px 0;cursor:pointer;text-align:center;font-size:11.5px;background:#fff;}
.preset-swatch .dot{width:22px;height:22px;border-radius:50%;margin:0 auto 6px;}
.preset-swatch:hover{border-color:var(--gold);}

.checklist{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;}
.checklist label{display:flex;align-items:center;gap:4px;}

@media print{
  @page { margin: 15mm; size: A4 portrait; }
  body *{visibility:hidden;}
  body{background:#fff !important;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;display:block !important;}
  header.cover,nav.tabs,.no-print{display:none !important;}
}
#printArea{display:none;}
</style>

<script>
/* ============ Storage helpers ============ */
/* ============ Storage bridge (pywebview <-> Python/SQLite) ============ */
/* This replaces the old window.storage.get/set (Claude-artifact only API).
   Same function names/signatures as before, so none of the app logic below
   needed to change — only this bridge. */
function pywebviewReady(){
  return new Promise(resolve=>{
    if(window.pywebview && window.pywebview.api) return resolve();
    window.addEventListener('pywebviewready', ()=>resolve(), {once:true});
  });
}
async function sGet(key, def){
  try{
    await pywebviewReady();
    const raw = await window.pywebview.api.storage_get(key);
    return (raw!==null && raw!==undefined)? JSON.parse(raw) : def;
  }catch(e){ console.error('storage get failed', key, e); return def; }
}
async function sSet(key, val){
  try{
    await pywebviewReady();
    const result = await window.pywebview.api.storage_set(key, JSON.stringify(val));
    if(result !== true){ console.error('storage set rejected', key, result); return false; }
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

/* ============ Utilities ============ */
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt = n => '$'+ (Math.round((n||0)*100)/100).toLocaleString('zh-Hant-TW');
function ymd(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function ym(d){ return ymd(d).slice(0,7); }
const todayStr = ()=> ymd(new Date());
function isValidDateStr(value){
  if(typeof value!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d=new Date(value+'T00:00:00');
  return !Number.isNaN(d.getTime()) && ymd(d)===value;
}
function positiveFiniteNumber(value){
  const n=typeof value==='number'?value:Number(value);
  return Number.isFinite(n) && n>0 ? n : null;
}
function nonNegativeFiniteNumber(value){
  const n=typeof value==='number'?value:Number(value);
  return Number.isFinite(n) && n>=0 ? n : null;
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const MIN_PASSWORD_LENGTH = 4; // 維持現行政策（4碼），不跟著其他建議改成8碼
function bytesToB64(bytes){
  let s=''; for(const b of bytes) s+=String.fromCharCode(b);
  return btoa(s);
}
function b64ToBytes(s){
  const bin=atob(s); const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
const PASSWORD_ITERATIONS = 150000;
async function hashPw(pw){
  if(!pw) return '';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:PASSWORD_ITERATIONS, hash:'SHA-256'}, key, 256);
  return `pbkdf2-sha256$${PASSWORD_ITERATIONS}$${bytesToB64(salt)}$${bytesToB64(new Uint8Array(bits))}`;
}
// 驗證密碼：新格式是加鹽 PBKDF2；舊帳號密碼欄位還是舊版無鹽 SHA-256 雜湊，
// 登入成功一次後會自動升級成新格式（見 doUnlock），不需要強迫所有舊帳號
// 一次重設密碼。
async function verifyPw(pw, stored){
  if(!stored) return {ok:false, needsUpgrade:false};
  if(stored.startsWith('pbkdf2-sha256$')){
    const parts=stored.split('$');
    if(parts.length!==4) return {ok:false, needsUpgrade:false};
    const iterations=Number(parts[1]);
    if(!Number.isInteger(iterations) || iterations<100000 || iterations>1000000) return {ok:false, needsUpgrade:false};
    try{
      const salt=b64ToBytes(parts[2]), expected=b64ToBytes(parts[3]);
      const key=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations,hash:'SHA-256'},key,expected.length*8));
      if(bits.length!==expected.length) return {ok:false,needsUpgrade:false};
      let diff=0; for(let i=0;i<bits.length;i++) diff|=bits[i]^expected[i]; // constant-time比較
      return {ok:diff===0,needsUpgrade:false};
    }catch(e){ console.error('password verification failed',e); return {ok:false,needsUpgrade:false}; }
  }
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const legacy = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  return {ok:legacy===stored,needsUpgrade:legacy===stored};
}
/* ---- EMAIL帳號啟用驗證（透過公開的 Google Sheet CSV 匯出端點，輕量檢查，非正式資安機制）---- */
function parseCSV(text){
  const rows = []; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(field); field=''; rows.push(row); row=[]; }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
// 使用者可以直接貼「整個 Google 試算表網址」，不用自己手動從網址裡截取那串
// 看不懂的 ID——這裡自動辨識：網址裡 /d/ 跟下一個 / 之間那段就是 ID；如果貼的
// 本來就只是那串 ID（沒有任何網址符號），就直接原樣使用。
function extractSheetIdFromInput(raw){
  const s = (raw||'').trim();
  const m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  const m2 = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m2) return m2[1];
  return s;
}
// 系統發行者唯一一份管理表的位置，所有社團共用同一份，不是每個社團各自的
// 設定，所以寫死在程式裡，不開放任何角色（含管理員）在畫面上查看或更改，
// 避免被誤改、也不需要在 UI 上呈現一個其實誰都不該去動的欄位。
const DEVELOPER_SHEET_ID = '1QQZ9-p1Y09TM33E9GfF1Cd7i5TT8qnsbG-Y7S6HCsJc';
const DEVELOPER_SHEET_NAME = '帳號';
async function fetchVerifySheetRows(id, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text = await res.text();
  return parseCSV(text);
}
async function checkEmailInSheet(email){
  if(inDesktopApp && window.pywebview && window.pywebview.api.check_email_in_sheet){
    try{
      return await window.pywebview.api.check_email_in_sheet(email, DEVELOPER_SHEET_ID, DEVELOPER_SHEET_NAME);
    }catch(e){ return { ok:false, found:false, error:true }; }
  }
  try{
    const rows = await fetchVerifySheetRows(DEVELOPER_SHEET_ID, DEVELOPER_SHEET_NAME);
    const target = (email||'').trim().toLowerCase();
    for(const r of rows){
      const a=(r[0]||'').trim().toLowerCase();
      const b=(r[1]||'').trim();
      if(a===target) return { ok: b==='啟用', found:true };
    }
    return { ok:false, found:false };
  }catch(e){ return { ok:false, found:false, error:true }; }
}
/* 整個帳本（此部署）的啟用檢查：每次開啟都會重新檢查，狀態會自動同步（管理員在Google表單啟用後，下次開啟即自動解鎖），不留死鎖 */
/* 診斷用：把每次遠端檢查「實際讀到什麼、程式怎麼判斷」寫進 state.config.
   remoteDiag。這些資料不在畫面上呈現（系統發行者才需要這些細節，一般使用
   者不需要也不該看到連線/Sheet內部細節），只是安靜存著；真的需要排查問題
   時，可以請對方匯出備份檔（系統設定 → 基本設定 → 備份與還原）回傳，
   backup JSON 裡的 config.remoteDiag 就能看到最近一次檢查的結果。只記錄
   「有沒有開啟/讀到什麼原始值」，不記錄任何密碼本身。*/
function recordDiag(partial){
  state.config.remoteDiag = Object.assign({}, state.config.remoteDiag||{}, partial,
    { lastCheckedAt: new Date().toLocaleString('zh-Hant-TW') });
}
// 給所有能進系統設定的人用的「立即重新檢查方案等級」按鈕（不用管理員身分也能按，

  renderTab();

}
const TRIAL_GRACE_DAYS = 7;
// 「未登記」試用期計時：沒填啟用信箱，或填了但系統發行者的 Sheet 裡完全查無
// 此人（連 Email 都還沒登記過），都算「尚未登記」，從第一次偵測到這個狀態起算，
// 超過 TRIAL_GRACE_DAYS 天沒有變成「已登記」就整個鎖死。跟下面「已登記但狀態
// 非啟用」的三次提醒機制是兩回事：那個是已經登記、只是還沒被標記啟用。
function trialDaysElapsed(){
  if(!state.config.trialStartedAt) state.config.trialStartedAt = new Date().toISOString();
  return (Date.now() - new Date(state.config.trialStartedAt).getTime()) / 86400000;
}
function clearTrialTimer(){ state.config.trialStartedAt = ''; }
async function checkActivation(){
  recordDiag({ activationCheckEnabled: !!state.config.features.activationCheck, activationEmailUsed: state.config.activationEmail||'' });
  if(!state.config.features.activationCheck) return { blocked:false };
  if(!state.config.activationEmail){
    const days = trialDaysElapsed();
    recordDiag({ statusError:`（尚未設定啟用信箱，未登記試用期已過 ${days.toFixed(1)}/${TRIAL_GRACE_DAYS} 天）` });
    await sSet('config', state.config);
    if(days >= TRIAL_GRACE_DAYS) return { blocked:true, trialExpired:true };
    return { blocked:false, trialDaysLeft: Math.max(0, Math.ceil(TRIAL_GRACE_DAYS - days)) };
  }
  const result = await checkEmailInSheet(state.config.activationEmail);
  recordDiag({ statusOk: !!result.ok, statusFound: !!result.found, statusError: result.error? '連線或讀取失敗（可能是網路問題，或 Sheet ID/分頁名稱填錯）' : '' });
  if(result.error){
    // 連不上網路/讀取失敗，無法判斷是否已登記，不應該因為暫時離線就懲罰使用者，
    // 這次先放行，等下次連得上網路時再正常檢查（不會因此延長或重置試用期）。
    await sSet('config', state.config);
    return { blocked:false };
  }
  if(!result.found){
    // Email 有填，但系統發行者的 Sheet 裡完全沒有這一筆——視同尚未登記。
    const days = trialDaysElapsed();
    recordDiag({ statusError:`（啟用信箱尚未出現在登記表中，未登記試用期已過 ${days.toFixed(1)}/${TRIAL_GRACE_DAYS} 天）` });
    await sSet('config', state.config);
    if(days >= TRIAL_GRACE_DAYS) return { blocked:true, trialExpired:true };
    return { blocked:false, trialDaysLeft: Math.max(0, Math.ceil(TRIAL_GRACE_DAYS - days)) };
  }
  // 查得到這筆（found:true）＝已經登記，不管目前是啟用或停用，都不算「未登記」了，
  // 試用期計時器可以清掉；是否可以繼續使用改由下面既有的「啟用/停用」三次提醒機制判斷。
  clearTrialTimer();
  if(result.ok){
    if(state.config.activationStrikes || state.config.activationLocked){
      state.config.activationStrikes = 0; state.config.activationLocked = false;
    }
    await sSet('config', state.config);
    return { blocked:false };
  }
  state.config.activationStrikes = (state.config.activationStrikes||0) + 1;
  state.config.activationLocked = state.config.activationStrikes >= 3;
  await sSet('config', state.config);
  return { blocked: state.config.activationLocked, strikes: state.config.activationStrikes };
}
/* 密碼重設（遠端標記）：跟啟用檢查讀同一份試算表的F欄。既有欄位配置是
   A:Email, B:狀態, C:功能, D:到期日, E:備註（C/D/E已被既有的
   setupSheetValidation() Apps Script／既有機制用掉），所以密碼重設標記
   放在再後面一欄的F欄，避免跟功能下拉選單衝突。系統管理者/發行者在該
   社團那一列的F欄填上要重設的登入帳號，這個帳本下次開啟連得到網路時
   就會把該帳號密碼重設成臨時密碼，並強制要求登入後立刻改新密碼。
   用 state.config.pendingPasswordResetMarker 記住「上次已經處理過的值」，
   避免同一格沒清空就被重複觸發；F欄清空後 marker 也會跟著清掉，之後才能
   再次觸發下一輪重設。*/
async function checkPasswordResetRequest(){
  if(!state.config.features.activationCheck || !state.config.activationEmail){
    recordDiag({ resetRaw:'（未啟用帳本啟用管制，不會檢查）' }); await sSet('config', state.config); return;
  }
  let resetUsername = '';
  try{
    if(inDesktopApp && window.pywebview && window.pywebview.api.check_password_reset_request){
      const r = await window.pywebview.api.check_password_reset_request(state.config.activationEmail, DEVELOPER_SHEET_ID, DEVELOPER_SHEET_NAME);
      if(!r.ok){ recordDiag({ resetRaw:'（連線或讀取失敗，詳見上面「啟用檢查」的錯誤訊息）' }); await sSet('config', state.config); return; }
      resetUsername = r.reset_username || '';
    } else {
      const rows = await fetchVerifySheetRows(DEVELOPER_SHEET_ID, DEVELOPER_SHEET_NAME);
      const target = state.config.activationEmail.trim().toLowerCase();
      for(const row of rows){
        if((row[0]||'').trim().toLowerCase()===target){ resetUsername = (row[5]||'').trim(); break; } // F欄（A:Email,B:狀態,C:功能,D:到期日,E:備註 已被既有機制用掉，故用F欄）
      }
    }
  }catch(e){ recordDiag({ resetRaw:'（連線時發生例外，可能是網路問題）' }); await sSet('config', state.config); return; }
  recordDiag({ resetRaw: resetUsername? resetUsername : '（空白，F欄目前沒有要求）' });
  const marker = state.config.pendingPasswordResetMarker || '';
  if(!resetUsername){
    if(marker){ state.config.pendingPasswordResetMarker=''; }
    await sSet('config', state.config);
    return;
  }
  if(resetUsername === marker){ await sSet('config', state.config); return; } // 這個要求上次已經處理過了
  state.config.pendingPasswordResetMarker = resetUsername; // 無論帳號找不找得到，都先標記已讀，避免一直跳提醒
  // 管理員帳號現在是帳冊共用、存在 registry 裡，不是這本帳本自己的 accounts
  // 清單，所以要重新設密碼的帳號可能落在 adminAccounts 或 state.accounts 其中一邊。
  const found = findAccountByUsername(resetUsername);
  recordDiag({ resetMatchedAccount: !!found });
  if(!found){
    await sSet('config', state.config);
    return;
  }
  // 隨機臨時密碼，不再用固定的 0000（固定值寫死在原始碼裡，任何看得到程式碼
  // 的人都會知道，等於形同虛設）；一樣強制登入後立刻改成使用者自己的新密碼。
  const tempPwAlphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const tempPwBytes = crypto.getRandomValues(new Uint8Array(12));
  const tempPw = Array.from(tempPwBytes, b=>tempPwAlphabet[b % tempPwAlphabet.length]).join('');
  found.acc.passwordHash = await hashPw(tempPw);
  found.acc.mustChangePassword = true;
  await persistAccountScope(found.scope);
  await sSet('config', state.config);
  setTimeout(()=> alert(`系統管理者已為帳號「${resetUsername}」重設密碼。\n臨時密碼為：${tempPw}\n請用這組臨時密碼登入，登入後系統會要求您立刻設定新密碼。`), 300);
}
/* ============ 功能分級授權（累加式方案，T1~T6） ============
   跟密碼重設一樣沿用同一份試算表，改讀 C 欄（這欄原本是舊版「功能」下拉
   選單，現在改放簡短代號）。採「累加」設計：代號在 FEATURE_TIER_CODES
   裡的位置愈後面，解鎖的功能愈多，每一級都包含前一級的全部功能，不需要
   在 Google Sheet 的下拉選單裡窮舉組合。對照表見 README「功能分級怎麼
   用」。沒開啟「帳本啟用管制」時視為不限制（維持舊有行為，只有真的設定
   了遠端管控的社團才會被這套分級規則影響）。*/
const FEATURE_TIER_ORDER = ['dualBook','budgetDoc','advance','style','mobileStaging'];
const FEATURE_TIER_CODES = ['T1','T2','T3','T4','T5','T6'];
const FEATURE_TIER_LABELS = { dualBook:'內外帳', budgetDoc:'進階預算書/結算書', advance:'幹部墊款／借支／現金銀行分帳', style:'個人風格自訂', mobileStaging:'線上輸入（手機記帳）' };
function allowedFeatureSet(code){
  const idx = FEATURE_TIER_CODES.indexOf(code); // 代號不在表裡（例如試算表還沒填、或打錯字）就當作最嚴格的 T1
  const cutoff = idx<0? 0 : idx;
  const allowed = {};
  FEATURE_TIER_ORDER.forEach((f,i)=>{ allowed[f] = i < cutoff; });
  return allowed;
}
function isFeatureAllowed(name){
  if(!state.config.features.activationCheck) return true; // 沒開啟遠端管制 = 不限制，維持單機使用時的舊行為
  return !!allowedFeatureSet(state.config.licenseTier||'T1')[name];
}
async function checkFeatureTier(){
  if(!state.config.features.activationCheck || !state.config.activationEmail){
    recordDiag({ tierRaw:'（未啟用帳本啟用管制，不會檢查）' }); await sSet('config', state.config); return;
  }
  let tier = '';
  try{
    if(inDesktopApp && window.pywebview && window.pywebview.api.check_feature_tier){
      const r = await window.pywebview.api.check_feature_tier(state.config.activationEmail, DEVELOPER_SHEET_ID, DEVELOPER_SHEET_NAME);
      if(!r.ok){ recordDiag({ tierRaw:'（連線或讀取失敗，詳見「啟用檢查」的錯誤訊息）' }); await sSet('config', state.config); return; } // 連不到網路就安靜跳過，沿用上次已知的等級，不影響正常登入
      tier = (r.tier||'').trim().toUpperCase();
    } else {
      const rows = await fetchVerifySheetRows(DEVELOPER_SHEET_ID, DEVELOPER_SHEET_NAME);
      const target = state.config.activationEmail.trim().toLowerCase();
      for(const row of rows){
        if((row[0]||'').trim().toLowerCase()===target){ tier = (row[2]||'').trim().toUpperCase(); break; }
      }
    }
  }catch(e){ recordDiag({ tierRaw:'（連線時發生例外，可能是網路問題）' }); await sSet('config', state.config); return; }
  recordDiag({ tierRaw: tier? tier : '（空白，C欄目前沒有填寫分級代號）' });
  if(!FEATURE_TIER_CODES.includes(tier)) tier = 'T1'; // 空白、打錯字都當作最嚴格，不要預設放寬
  let changed = state.config.licenseTier !== tier;
  state.config.licenseTier = tier;
  const allowed = allowedFeatureSet(tier);
  // 被降級/未授權的功能，直接強制關閉（不是只把畫面上的勾選框變灰色而已），
  // 避免舊的勾選狀態留在 config 裡，讓其他地方的業務邏輯誤判成「這功能是開的」
  ['dualBook','budgetDoc','advance'].forEach(f=>{
    if(!allowed[f] && state.config.features[f]){ state.config.features[f] = false; changed = true; }
  });
  if(!allowed.mobileStaging && state.config.mobileStaging.enabled){ state.config.mobileStaging.enabled = false; changed = true; }
  await sSet('config', state.config); // 不管 changed 與否都存，確保 remoteDiag 的最新讀取結果一定會被保存
}
function shade(hex, percent){
  let f=parseInt(hex.slice(1),16), t=percent<0?0:255, p=Math.abs(percent)/100;
  let R=f>>16, G=(f>>8)&0x00FF, B=f&0x0000FF;
  const nr=Math.round((t-R)*p)+R, ng=Math.round((t-G)*p)+G, nb=Math.round((t-B)*p)+B;
  return '#'+(0x1000000+nr*0x10000+ng*0x100+nb).toString(16).slice(1);
}

// 升級邏輯：舊版的管理員帳號是存在「這本帳本自己的」accounts 清單裡。帳冊層級
// 的共用管理員帳號上線後，第一次開啟一本「還有舊式管理員帳號、但帳冊共用清單
// 還是空的」帳本時，問使用者要不要把這些管理員帳號升級成帳冊共用（橫跨所有
// 帳本都能登入）。一定要先問過才動手，不能默默覆蓋或刪除任何人的帳號——使用者
// 選「否」的話，這本帳本的舊管理員帳號原封不動留著，還是能照舊登入這一本。
async function maybeMigrateAdminAccounts(){
  if(!inDesktopApp) return; // 瀏覽器原型模式沒有帳冊層級的儲存，不處理
  if(adminAccounts.length>0) return; // 帳冊已經有共用管理員帳號了，不用再問
  const legacyAdmins = (state.accounts||[]).filter(a=>a.role==='管理員');
  if(!legacyAdmins.length) return;
  const names = legacyAdmins.map(a=>`「${a.displayName}」(${a.username})`).join('、');
  const ok = confirm(
    `偵測到這本帳本有自己的管理員帳號：${names}。\n\n` +
    `建議把管理員帳號升級成「帳冊共用」，之後不管開哪一本帳本都能用同一組帳號密碼登入，` +
    `也不會再發生「刪掉某本帳本結果管理員帳號一起消失、登不進其他帳本」的狀況。\n\n` +
    `要現在升級嗎？（選「取消」的話這本帳本的管理員帳號維持原狀，之後仍可在「系統設定 → 帳號與權限」手動升級）`
  );
  if(!ok) return;
  for(const a of legacyAdmins){
    if(!adminAccounts.some(x=>x.username===a.username)) adminAccounts.push({...a});
  }
  state.accounts = state.accounts.filter(a=>a.role!=='管理員');
  await saveAdminAccounts();
  await sSet('accounts', state.accounts);
  alert('已升級完成，管理員帳號現在可以登入帳冊底下的所有帳本。');
}

async function loadAll(){
  const [config, accounts, handlers, departments, categories, projects, transactions, budgetPlans, oldBudgetPlan, signatures] = await Promise.all([
    sGet('config', null), sGet('accounts', []), sGet('handlers', null), sGet('departments', []),
    sGet('categories', null), sGet('projects', []), sGet('transactions', []),
    sGet('budgetPlans', null), sGet('budgetPlan', null), sGet('signatures', null)
  ]);
  if(config) state.config = Object.assign(state.config, config, {
    features:Object.assign({dualBook:false,budgetDoc:false,advance:false,activationCheck:false}, config.features||{}),
    mobileStaging:Object.assign({enabled:false,sheetId:'',sheetName:'表單回應 1',lastBackupTime:''}, config.mobileStaging||{}),
    licenseTier: config.licenseTier || 'T1',
    remoteDiag: Object.assign({ lastCheckedAt:'', activationCheckEnabled:false, activationEmailUsed:'', statusOk:null, statusFound:null, statusError:'', tierRaw:'', resetRaw:'', resetMatchedAccount:null }, config.remoteDiag||{}),
    fontStyle: config.fontStyle||'serif', fontSize: config.fontSize||'md', radiusStyle: config.radiusStyle||'sharp'
  });
  state.config.semesters = (state.config.semesters||[]).map(s=>({ shortCode:s.name, ...s }));
  state.accounts = (accounts||[]).map(a=>{
    const preset = ROLE_PRESETS[a.role] || ROLE_PRESETS['其他'];
    return Object.assign({ allowedTabs: preset.allowedTabs, canReimburse: preset.canReimburse, canViewInternal:true }, a);
  });
  if(handlers){ state.handlers = handlers; }
  else {
    const names = [...new Set(state.accounts.map(a=>a.displayName).filter(Boolean))];
    state.handlers = names.map(n=>({ id:uid(), name:n }));
    if(state.handlers.length) await sSet('handlers', state.handlers);
  }
  state.departments = (departments||[]).map(d=>({ semesterId:null, budget:0, ...d }));
  if(categories) state.categories = categories;
  state.projects = (projects||[]).map(p=>({ semesterId:null, closed: p.status==='已結束', ...p }));
  state.transactions = (transactions||[]).map(t=> Object.assign({ paymentStatus:'paid', account: (t.method==='現金'?'cash':'bank'), reimbursed:false, reimburseDate:null, reimburseAccount:null, internalOnly:false, invoiceNumber:'', recordedBy:'' }, t));
  if(budgetPlans) state.budgetPlans = budgetPlans;
  else if(oldBudgetPlan) state.budgetPlans = { '': oldBudgetPlan };
  if(signatures) state.signatures = Object.assign(state.signatures, signatures);
  workingSemId = autoDetectSemesterId();
}
function autoDetectSemesterId(){
  const today = todayStr();
  const s = state.config.semesters.find(s=> s.start<=today && today<=s.end);
  return s? s.id : '';
}
let inDesktopApp = false;
function detectPywebview(){
  return new Promise(resolve=>{
    if(window.pywebview && window.pywebview.api) return resolve(true);
    let resolved = false;
    window.addEventListener('pywebviewready', ()=>{ resolved=true; resolve(true); }, {once:true});
    // Not running inside the pywebview desktop shell (e.g. still previewing
    // as a plain browser/Claude artifact) — proceed straight to the app,
    // skipping the multi-ledger picker entirely.
    setTimeout(()=>{ if(!resolved) resolve(false); }, 400);
  });
}
async function init(){
  inDesktopApp = await detectPywebview();
  if(inDesktopApp){
    const active = await window.pywebview.api.get_active_ledger();
    if(!active){ renderLedgerPicker(); return; }
  }
  await bootApp();
}
async function bootApp(){
  await loadAll();
  await loadAdminAccounts();
  await maybeMigrateAdminAccounts();
  applyTheme();
  if(state.config.setup && state.config.features.activationCheck){
    renderActivationChecking();
    const result = await checkActivation();
    if(result.blocked){
      if(result.trialExpired) renderTrialExpired(); else renderActivationBlocked();
      resetIdle(); return;
    }
    await checkFeatureTier(); // 先確定這次開啟的功能分級，再畫畫面，設定頁的勾選框才會一開始就是正確的鎖定狀態
    renderLock();
    resetIdle();
    if(result.strikes){
      setTimeout(()=> alert(`此帳本尚未於系統啟用表確認為「啟用」，這是第 ${result.strikes}/3 次提醒，達3次後將暫時無法使用，請聯繫系統管理員確認啟用狀態。`), 300);
    } else if(result.trialDaysLeft!==undefined){
      // 原本只有剩 3 天內才跳提醒，等於沒填信箱的前 4 天完全沒有任何提示，
      // 使用者容易忘記這件事、拖到試用期快到才發現。改成只要「尚未登記」
      // 這個狀態還在，每次開啟都提醒（不是只剩最後 3 天才提醒），天數上限
      // （7天整個鎖死）維持不變，只是提醒要提早、提醒要更頻繁。
      setTimeout(()=> alert(`這本帳本尚未登記啟用信箱（或信箱尚未出現在系統發行者的登記表中），還剩 ${result.trialDaysLeft} 天試用期，之後將無法使用，請盡快到「系統設定 → 基本設定」填寫啟用信箱並聯繫系統發行者完成登記。`), 300);
    }
    checkPasswordResetRequest();
    return;
  }
  renderLock();
  resetIdle();
}

async function doSetup(){

    newAdmin = { id:uid(), displayName:adminName, username:user, passwordHash: await hashPw(pw), role:'管理員', canEdit:true, canReimburse:true, canViewInternal:true, allowedTabs:[...ALL_TAB_IDS] };
  }

    features: Object.assign({}, state.config.features, { activationCheck:true }) });

  await sSet('config', state.config); await sSet('accounts', state.accounts);

    adminAccounts.push(newAdmin);

    currentAccountScope = 'admin';

async function doUnlock(){
  const raw = document.getElementById('loginAcc').value;
  const [scope, accId] = raw.includes(':')? raw.split(':') : ['local', raw];
  const acc = (scope==='admin'? adminAccounts : state.accounts).find(a=>a.id===accId); if(!acc) return;
  const pw = document.getElementById('loginPw').value;
  const verified = await verifyPw(pw, acc.passwordHash);
  if(!verified.ok){ document.getElementById('lockErr').textContent = '密碼錯誤，請再試一次'; return; }
  if(verified.needsUpgrade){
    // 舊版無鹽 SHA-256 密碼登入成功，順手升級成加鹽 PBKDF2 格式再存回去。
    acc.passwordHash = await hashPw(pw);
    if(!(await persistAccountScope(scope))){
      document.getElementById('lockErr').textContent = '登入成功，但安全升級儲存失敗，請稍後再試';
      return;
    }
  }
  currentAccount = acc;
  currentAccountScope = scope;
  if(acc.mustChangePassword){ renderForceChangePassword(); return; }
  unlocked = true; enterApp();
}

/* ============ Charts (pure SVG, no libs) ============ */
function svgDonut(data, size){
  size = size||180;
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total<=0) return `<div class="empty">尚無資料可繪製圖表</div>`;
  const r=size/2, cx=r, cy=r, ir=r*0.58;
  if(data.length===1){
    const d0=data[0];
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${d0.color}"></circle><circle cx="${cx}" cy="${cy}" r="${ir}" fill="#fff"></circle></svg>`;
  }
  let angle=-Math.PI/2, paths='';
  data.forEach(d=>{
    const frac = d.value/total;
    const a2 = angle + frac*2*Math.PI;
    const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
    const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
    const ix1=cx+ir*Math.cos(a2), iy1=cy+ir*Math.sin(a2);
    const ix2=cx+ir*Math.cos(angle), iy2=cy+ir*Math.sin(angle);
    const large = frac>0.5? 1:0;
    paths += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${ix1},${iy1} A${ir},${ir} 0 ${large} 0 ${ix2},${iy2} Z" fill="${d.color}"></path>`;
    angle = a2;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
}
function chartLegend(data){
  const total = data.reduce((s,d)=>s+d.value,0)||1;
  return `<div class="legend">${data.map(d=>`<div class="li"><span class="sw" style="background:${d.color}"></span>${escapeHtml(d.label)} <span class="muted num">${fmt(d.value)}（${(d.value/total*100).toFixed(0)}%）</span></div>`).join('')}</div>`;
}
function svgBarChart(labels, seriesA, seriesB, colorA, colorB, w, h){
  w=w||560; h=h||200;
  const max = Math.max(1, ...seriesA, ...seriesB);
  const n = labels.length; const groupW = w/n; const barW = groupW*0.32; const padBottom=22;
  let bars='';
  labels.forEach((lb,i)=>{
    const gx = i*groupW + groupW*0.14;
    const ah=(seriesA[i]/max)*(h-padBottom), bh=(seriesB[i]/max)*(h-padBottom);
    bars += `<rect x="${gx}" y="${h-padBottom-ah}" width="${barW}" height="${ah}" fill="${colorA}"></rect>`;
    bars += `<rect x="${gx+barW+4}" y="${h-padBottom-bh}" width="${barW}" height="${bh}" fill="${colorB}"></rect>`;
    bars += `<text x="${gx+barW}" y="${h-6}" font-size="10.5" fill="#5b6a61" text-anchor="middle">${escapeHtml(lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${bars}</svg>`;
}
function svgSingleBar(labels, values, color, w, h){
  w=w||560; h=h||220;
  const max = Math.max(1, ...values); const n=labels.length||1; const groupW=w/n; const barW=groupW*0.5; const padBottom=34;
  let bars='';
  labels.forEach((lb,i)=>{
    const gx = i*groupW + (groupW-barW)/2;
    const bh = (values[i]/max)*(h-padBottom);
    bars += `<rect x="${gx}" y="${h-padBottom-bh}" width="${barW}" height="${bh}" fill="${color}"></rect>`;
    bars += `<text x="${gx+barW/2}" y="${h-padBottom+16}" font-size="10" fill="#5b6a61" text-anchor="middle">${escapeHtml(lb.length>7?lb.slice(0,7)+'…':lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">${bars}</svg>`;
}
function svgLineChart(labels, values, color, w, h){
  w=w||560; h=h||200;
  const max = Math.max(1, ...values); const min = Math.min(0, ...values); const range = Math.max(1, max-min);
  const n=labels.length; const stepX = n>1? w/(n-1) : 0; const padBottom=22;
  const pts = values.map((v,i)=>[ i*stepX, h-padBottom - ((v-min)/range)*(h-padBottom) ]);
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"></circle>`).join('');
  const labelsSvg = labels.map((lb,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-6}" font-size="10.5" fill="#5b6a61" text-anchor="middle">${escapeHtml(lb)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px"><path d="${path}" fill="none" stroke="${color}" stroke-width="2"></path>${dots}${labelsSvg}</svg>`;
}

async function saveTransfer(id){
  if(!guard()) return;
  const amount = positiveFiniteNumber(document.getElementById('trAmount').value);
  if(amount===null){ alert('請輸入正確的金額'); return; }
  const date = document.getElementById('trDate').value || todayStr();
  if(!isValidDateStr(date)){ alert('日期格式或日期內容不正確'); return; }
  const fromAccount = document.getElementById('trFrom').value;
  if(fromAccount!=='cash' && fromAccount!=='bank'){ alert('資金帳戶不正確'); return; }
  const toAccount = fromAccount==='cash'? 'bank':'cash';
  const data = { type:'轉帳', date, amount, fromAccount, toAccount, note: document.getElementById('trNote').value.trim(),
    category:'轉帳', subCategory:'', projectId:null, departmentId:null, method: fromAccount==='cash'?'現金':'銀行轉帳', account:toAccount, handler:'', counterparty:'', tags:[], externalOnly:false, paymentStatus:'paid', reimbursed:false, reimburseDate:null, reimburseAccount:null };
  if(!id){ data.recordedBy = currentAccount? currentAccount.displayName : ''; }
  if(id){ const idx=state.transactions.findIndex(t=>t.id===id); state.transactions[idx]={...state.transactions[idx], ...data}; }
  else state.transactions.push({ id: uid(), ...data });
  await sSet('transactions', state.transactions);
  closeModal(); renderTab();
}

  return `

async function batchSettle(kind){
  if(!guardReimburse()) return;
  if(kind!=='advance' && kind!=='draw'){ alert('處理類型不正確'); return; }
  const chkClass = 'settleChk_'+kind;
  const ids = Array.from(document.querySelectorAll('.'+chkClass+':checked')).map(el=>el.value);
  if(!ids.length){ alert('請先勾選要處理的項目'); return; }
  const date = document.getElementById('settleDate_'+kind).value || todayStr();
  if(!isValidDateStr(date)){ alert('歸墊/收回日期不正確'); return; }
  const account = document.getElementById('settleAccount_'+kind).value;
  if(account!=='cash' && account!=='bank'){ alert('入帳帳戶不正確'); return; }
  // 勾選之後、按下按鈕之前，資料可能已經被別的操作改掉（例如同一筆已經被
  // 處理過、或被刪除），這裡重新核對一次，避免拿舊的勾選狀態去動已經不對
  // 的資料。
  const validIds = new Set(state.transactions.filter(t=>
    ids.includes(t.id) && t.paymentStatus===kind && !t.reimbursed && Number.isFinite(Number(t.amount)) && Number(t.amount)>0
  ).map(t=>t.id));
  if(validIds.size!==ids.length){ alert('部分選取項目已不存在、已處理或資料不完整，請重新整理後再試。'); return; }
  if(kind==='advance'){
    state.transactions.forEach(t=>{ if(ids.includes(t.id)){ t.reimbursed=true; t.reimburseDate=date; t.reimburseAccount=account; } });
  } else {
    ids.forEach(txId=>{
      const orig = state.transactions.find(t=>t.id===txId); if(!orig) return;
      orig.reimbursed = true; orig.reimburseDate = date; orig.reimburseAccount = account;
      state.transactions.push({
        id: uid(), type:'收入', date, category:'借支收回', subCategory:'', amount: orig.amount,
        projectId:null, departmentId:null, method: account==='cash'?'現金':'銀行轉帳', handler: orig.handler,
        counterparty: orig.counterparty, tags:['資金往來'], note: `對應原借支：${orig.note||orig.category}（${orig.date}）`,
        externalOnly:false, paymentStatus:'draw_return', account, reimbursed:false, reimburseDate:null, reimburseAccount:null
      });
    });
  }
  await sSet('transactions', state.transactions);
  alert('已處理 '+ids.length+' 筆');
  renderTab();
}
function filterTx(){
  return state.transactions.filter(t=>{
    if(txFilter.projectId==='__none__' && t.projectId) return false;
    if(txFilter.projectId && txFilter.projectId!=='__none__' && t.projectId!==txFilter.projectId) return false;
    if(txFilter.type && t.type!==txFilter.type) return false;
    if(txFilter.from && t.date < txFilter.from) return false;
    if(txFilter.to && t.date > txFilter.to) return false;
    return true;
  });
}

  if(!guard()) return;
  const amount = positiveFiniteNumber(document.getElementById('txAmount').value);
  if(amount===null){ alert('請輸入正確的金額'); return; }
  const date = document.getElementById('txDate').value || todayStr();
  if(!isValidDateStr(date)){ alert('日期格式或日期內容不正確'); return; }
  const projectId = document.getElementById('txProject').value || null;
  const type = document.getElementById('txType').value;
  if(type!=='收入' && type!=='支出'){ alert('收支類型不正確'); return; }
  const project = state.projects.find(p=>p.id===projectId);
  const advOn = state.config.features.advance;
  let paymentStatus = advOn? document.getElementById('txPayStatus').value : 'paid';
  const data = {
    type, date,
    category: document.getElementById('txCategory').value, subCategory: document.getElementById('txSubCategory').value || '',
    amount, projectId, departmentId: project? (project.departmentId||null) : (document.getElementById('txDept').value || null),
    method: document.getElementById('txMethod').value, handler: document.getElementById('txHandler').value,
    counterparty: document.getElementById('txCounterparty').value.trim(),
    tags: document.getElementById('txTags').value.split(',').map(s=>s.trim()).filter(Boolean),
    invoiceNumber: document.getElementById('txInvoiceNumber').value.trim(),
    note: document.getElementById('txNote').value.trim(),
    externalOnly: state.config.features.dualBook? !!document.getElementById('txExternalOnly').checked : false,
    internalOnly: state.config.features.dualBook? !!document.getElementById('txInternalOnly').checked : false,
    paymentStatus, account: (document.getElementById('txMethod').value==='現金'?'cash':'bank')
  };
  if(!id){ data.recordedBy = currentAccount? currentAccount.displayName : ''; }
  if(paymentStatus==='advance' || paymentStatus==='draw'){ data.reimbursed = (id? (state.transactions.find(x=>x.id===id)||{}).reimbursed : false) || false; }
  else { data.reimbursed=false; data.reimburseDate=null; data.reimburseAccount=null; }
  if(project && project.closed){
    if(!confirm(`「${project.name}」已標記為已結束，仍要新增/修改這筆帳目嗎？`)) return;
  }
  if(type==='支出' && project && project.budget>0 && paymentStatus!=='draw'){
    const spent = state.transactions.filter(t=>t.projectId===project.id && t.type==='支出' && isInternalCounted(t) && t.id!==id).reduce((s,t)=>s+t.amount,0);
    if(!data.externalOnly && spent+amount > project.budget){
      if(!confirm(`此筆將使「${project.name}」支出超出預算（預算 ${fmt(project.budget)}，累計將達 ${fmt(spent+amount)}），是否仍要儲存？`)) return;
    }
  }
  if(id){ const idx=state.transactions.findIndex(t=>t.id===id); state.transactions[idx]={...state.transactions[idx], ...data}; }
  else state.transactions.push({ id: uid(), ...data });
  await sSet('transactions', state.transactions);
  closeModal(); renderTab();
}
async function deleteTx(id){
  if(!guard()) return;
  if(!confirm('確定要刪除這筆帳目嗎？')) return;
  state.transactions = state.transactions.filter(t=>t.id!==id);
  await sSet('transactions', state.transactions); renderTab();
}

function suggestProjectSemester(){
  const startVal = document.getElementById('pjStart').value; if(!startVal) return;
  const sem = state.config.semesters.find(s=> s.start<=startVal && startVal<=s.end);
  if(sem){ const sel=document.getElementById('pjSem'); if(sel) sel.value = sem.id; }
}
async function saveProject(id){
  if(!guard()) return;
  const name = document.getElementById('pjName').value.trim();
  if(!name){ alert('請輸入名稱'); return; }
  const startDate = document.getElementById('pjStart').value;
  const endDate = document.getElementById('pjEnd').value;
  if(startDate && !isValidDateStr(startDate)){ alert('開始日期不正確'); return; }
  if(endDate && !isValidDateStr(endDate)){ alert('結束日期不正確'); return; }
  if(startDate && endDate && startDate>endDate){ alert('結束日期不能早於開始日期'); return; }
  const budget = nonNegativeFiniteNumber(document.getElementById('pjBudget').value || 0);
  if(budget===null){ alert('預算金額不正確'); return; }
  const data = {
    name, semesterId: document.getElementById('pjSem').value || null,
    type: document.getElementById('pjType').value,
    departmentId: document.getElementById('pjDept').value || null,
    startDate, endDate, budget, note: document.getElementById('pjNote').value.trim()
  };
  if(id){ const idx=state.projects.findIndex(p=>p.id===id); state.projects[idx]={...state.projects[idx], ...data}; }
  else state.projects.push({ id: uid(), closed:false, ...data });
  await sSet('projects', state.projects);
  closeModal(); renderTab();
}
async function toggleProjectClosed(id){
  if(!guard()) return;
  const p = state.projects.find(x=>x.id===id); if(!p) return;
  p.closed = !p.closed;
  await sSet('projects', state.projects);
  renderTab();
}
async function deleteProject(id){
  if(!guard()) return;
  if(!confirm('刪除專案不會刪除已記錄的帳目，但帳目將變成「行政/一般」，確定刪除？')) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  state.transactions.forEach(t=>{ if(t.projectId===id) t.projectId=null; });
  await sSet('projects', state.projects); await sSet('transactions', state.transactions);
  currentProjectId=null; renderTab();
}

        ${c.subs.length? `<div class="subcat-list">${c.subs.map(s=>`<div class="cat-row" style="border:none;padding:4px 0;">${escapeHtml(s.name)} ${canEdit()? `<button class="btn small danger" onclick="removeSubCategory('${kind}','${c.id}','${s.id}')">刪除</button>`:''}</div>`).join('')}</div>` : ''}
      `).join('')}
    </div>`;
  return `<p class="desc">帳目分類為全社團共用，不分學期</p><div style="display:flex; gap:24px; flex-wrap:wrap;">${block('income','收入分類')}${block('expense','支出分類')}</div>`;
}
async function addMainCategory(kind){
  if(!guard()) return;
  const input = document.getElementById(`new_${kind}_main`); const val=input.value.trim(); if(!val) return;
  if(!state.categories[kind].some(c=>c.name===val)) state.categories[kind].push({id:uid(), name:val, subs:[]});
  await sSet('categories', state.categories); renderTab();
}
async function removeMainCategory(kind,id){
  if(!guard()) return;
  if(!confirm('刪除此大分類（含底下小分類）？')) return;
  state.categories[kind] = state.categories[kind].filter(c=>c.id!==id);
  await sSet('categories', state.categories); renderTab();
}
async function addSubCategory(kind,mainId){
  if(!guard()) return;
  const val = prompt('請輸入小分類名稱：'); if(!val) return;
  const main = state.categories[kind].find(c=>c.id===mainId);
  if(main && !main.subs.some(s=>s.name===val)) main.subs.push({id:uid(), name:val.trim()});
  await sSet('categories', state.categories); renderTab();
}
async function removeSubCategory(kind,mainId,subId){
  if(!guard()) return;
  const main = state.categories[kind].find(c=>c.id===mainId);
  if(main) main.subs = main.subs.filter(s=>s.id!==subId);
  await sSet('categories', state.categories); renderTab();
}

let reportTo = todayStr();
let reportSemId = '';
let reportProjectId = '';
let reportDeptId = '';
let reportBook = 'internal';
let reportTagFilter = '';

function rangeToDates(){
  if(reportIntervalType==='month'){
    const [y,m] = reportMonthPick.split('-').map(Number);
    const s = new Date(y, m-1, 1); const e = new Date(y, m, 0);
    return [ymd(s), ymd(e)];
  }
  if(reportIntervalType==='semester'){
    if(!reportSemId) reportSemId = autoDetectSemesterId() || (state.config.semesters[0]? state.config.semesters[0].id : '');
    const sem = state.config.semesters.find(s=>s.id===reportSemId);
    if(sem) return [sem.start, sem.end];
    return [todayStr().slice(0,8)+'01', todayStr()];
  }
  if(reportIntervalType==='custom') return [reportFrom, reportTo];
  return ['0000-01-01','9999-12-31'];
}
function effectiveReportBook(){
  if(!state.config.features.dualBook) return 'internal';
  if(!canViewInternal()) return 'external';
  return reportBook;
}
function reportTxList(){
  const [from,to] = rangeToDates();
  const book = effectiveReportBook();
  return state.transactions.filter(t=>{
    if(t.type==='轉帳') return false;
    if(FUND_FLOW_TYPES.includes(t.paymentStatus)) return false;
    if(t.date<from || t.date>to) return false;
    if(book==='internal' && !isInternalCounted(t)) return false;
    if(book==='external' && t.internalOnly) return false;
    if(reportTagFilter && !(t.tags||[]).includes(reportTagFilter)) return false;
    return true;
  });
}

function monthBucketsForRange(){
  const [from,to] = rangeToDates();
  if(from==='0000-01-01' || to==='9999-12-31'){
    const now=new Date(); const months=[];
    for(let i=5;i>=0;i--){ const dd=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(ym(dd)); }
    return months;
  }
  const months=[]; let cur=new Date(from.slice(0,7)+'-01T00:00:00'); const endD=new Date(to.slice(0,7)+'-01T00:00:00'); let g=0;
  while(cur<=endD && g<24){ months.push(ym(cur)); cur.setMonth(cur.getMonth()+1); g++; }
  return months.length? months : [todayStr().slice(0,7)];
}
function reportCharts(){
  const list = reportTxList();
  if(chartKind==='exp_pie' || chartKind==='inc_pie'){
    const want = chartKind==='exp_pie'? '支出':'收入';
    const agg={}; list.filter(t=>t.type===want).forEach(t=>{ agg[t.category]=(agg[t.category]||0)+t.amount; });
    const pal = getChartPalette();
    const data = Object.entries(agg).sort((a,b)=>b[1]-a[1]).map(([l,v],i)=>({label:l,value:v,color:pal[i%pal.length]}));
    return data.length? `<div class="chart-wrap">${svgDonut(data,200)}${chartLegend(data)}</div>` : '<div class="empty">此區間尚無資料</div>';
  }
  if(chartKind==='month_bar' || chartKind==='balance_line'){
    const months = monthBucketsForRange();
    const incArr = months.map(m=> list.filter(t=>t.type==='收入' && t.date.slice(0,7)===m).reduce((s,t)=>s+t.amount,0));
    const expArr = months.map(m=> list.filter(t=>t.type==='支出' && t.date.slice(0,7)===m).reduce((s,t)=>s+t.amount,0));
    const labels = months.map(m=> m.slice(2).replace('-','/'));
    if(chartKind==='month_bar') return svgBarChart(labels, incArr, expArr, '#b8923e','#9c4237') + `<div class="legend" style="margin-top:8px;"><span class="li"><span class="sw" style="background:#b8923e"></span>收入</span> <span class="li" style="margin-left:14px;"><span class="sw" style="background:#9c4237"></span>支出</span></div>`;
    let running=0; const balArr = months.map((m,i)=>{ running += (incArr[i]-expArr[i]); return running; });
    return svgLineChart(labels, balArr, '#3a5a78');
  }
  if(chartKind==='dept_bar'){
    const agg={}; list.filter(t=>t.type==='支出').forEach(t=>{ const dn=(state.departments.find(d=>d.id===deptOf(t))||{name:'未分類'}).name; agg[dn]=(agg[dn]||0)+t.amount; });
    const labels=Object.keys(agg), values=Object.values(agg);
    return labels.length? svgSingleBar(labels, values, '#9c4237') : '<div class="empty">此區間尚無部門支出資料</div>';
  }
  if(chartKind==='proj_bar'){
    const agg={}; list.filter(t=>t.type==='支出').forEach(t=>{ const pn=(state.projects.find(p=>p.id===t.projectId)||{name:'行政/一般'}).name; agg[pn]=(agg[pn]||0)+t.amount; });
    const labels=Object.keys(agg), values=Object.values(agg);
    return labels.length? svgSingleBar(labels, values, '#b8923e') : '<div class="empty">此區間尚無專案支出資料</div>';
  }
  if(chartKind==='cash_bank_pie'){
    const [,to] = rangeToDates();
    let cashBal=0, bankBal=0;
    state.transactions.filter(t=> t.date<=to && (t.type==='轉帳' || isRealizedInternal(t))).forEach(t=>{
      if(t.type==='轉帳'){ if(t.fromAccount==='cash'){cashBal-=t.amount;bankBal+=t.amount;} else {bankBal-=t.amount;cashBal+=t.amount;} return; }
      const acc=txAccount(t); const v=(t.type==='收入'?t.amount:-t.amount); if(acc==='cash') cashBal+=v; else if(acc==='bank') bankBal+=v;
    });
    const data=[{label:'現金',value:Math.max(0,cashBal),color:'#b8923e'},{label:'銀行',value:Math.max(0,bankBal),color:'#3a5a78'}];
    return (cashBal+bankBal)>0? `<div class="chart-wrap">${svgDonut(data,180)}${chartLegend(data)}</div>` : '<div class="empty">尚無資料</div>';
  }
  if(chartKind==='tag_bar'){
    const agg={};
    list.filter(t=>t.type==='支出').forEach(t=>{ (t.tags||[]).forEach(tag=>{ agg[tag]=(agg[tag]||0)+t.amount; }); });
    const labels=Object.keys(agg), values=Object.values(agg);
    return labels.length? svgSingleBar(labels, values, '#7a5c8e') : '<div class="empty">此區間尚無標籤資料，請先為帳目加上標籤</div>';
  }
  if(chartKind==='dept_budget_bar'){
    const depts = state.departments.filter(d=>d.budget>0);
    const labels = depts.map(d=>{ const sem=state.config.semesters.find(s=>s.id===d.semesterId); return d.name + (sem? '('+semLabel(sem)+')':''); });
    const values = depts.map(d=>{ const expense=state.transactions.filter(t=>t.type==='支出' && isInternalCounted(t) && deptOf(t)===d.id).reduce((s,t)=>s+t.amount,0); return Math.round(expense/d.budget*100); });
    return labels.length? svgSingleBar(labels, values, '#9c4237')+'<p class="desc" style="margin-top:6px;">長條數值為預算執行率（%），可能超過100%表示超支</p>' : '<div class="empty">尚未設定任何部門預算</div>';
  }
  if(chartKind==='semester_compare_bar'){
    const sems = state.config.semesters;
    if(!sems.length) return '<div class="empty">尚未設定任何學期</div>';
    const labels = sems.map(s=>s.shortCode||s.name);
    const incArr = sems.map(s=> state.transactions.filter(t=>t.type==='收入' && isInternalCounted(t) && t.date>=s.start && t.date<=s.end).reduce((sum,t)=>sum+t.amount,0));
    const expArr = sems.map(s=> state.transactions.filter(t=>t.type==='支出' && isInternalCounted(t) && t.date>=s.start && t.date<=s.end).reduce((sum,t)=>sum+t.amount,0));
    return svgBarChart(labels, incArr, expArr, '#b8923e','#9c4237') + `<div class="legend" style="margin-top:8px;"><span class="li"><span class="sw" style="background:#b8923e"></span>收入</span> <span class="li" style="margin-left:14px;"><span class="sw" style="background:#9c4237"></span>支出</span></div>`;
  }
  return '<div class="empty">請選擇圖表類型</div>';
}

function budgetDocSection(){
  if(!workingSemId) return `<div class="card"><h2 class="serif">進階預算書 / 結算書</h2><p class="desc">請先於上方選擇一個確切的學期，才能編列該學期的預算分配。</p></div>`;
  if(!state.budgetPlans[workingSemId]) state.budgetPlans[workingSemId] = { totalAmount:0, mode:'ratio', allocations:{} };
  const bp = state.budgetPlans[workingSemId];
  const sem = state.config.semesters.find(s=>s.id===workingSemId);
  const modeSel = `<select class="input" onchange="bpSetMode(this.value)"><option value="ratio" ${bp.mode==='ratio'?'selected':''}>比例分配（%）</option><option value="amount" ${bp.mode==='amount'?'selected':''}>直接金額分配</option></select>`;
  let allocSum = 0;
  const depts = state.departments.filter(inSemScope);
  const rows = depts.map(d=>{
    const v = bp.allocations[d.id]||0;
    const allocated = bp.mode==='ratio'? (bp.totalAmount * v/100) : v;
    allocSum += allocated;
    return `<tr><td>${escapeHtml(d.name)}</td><td><input class="input" style="width:90px" type="number" value="${v||''}" onchange="bpSetAlloc('${d.id}', this.value)">${bp.mode==='ratio'?'%':''}</td><td style="text-align:right" class="num">${fmt(allocated)}</td></tr>`;
  }).join('');
  const diff = bp.totalAmount - allocSum;
  return `
    <div class="card">
      <h2 class="serif">進階預算書 / 結算書 － ${escapeHtml(semLabel(sem))}</h2>
      <p class="desc">量入為出：先設定本學期總預算，再依比例或金額分配至各部門，可儲存為各部門正式預算，也可產生預算書與結算書</p>
      <div class="row-actions">
        <label style="font-size:12px;color:var(--ink-soft)">總預算</label>
        <input class="input" type="number" style="width:130px" value="${bp.totalAmount||''}" onchange="bpSetTotal(this.value)">
        ${modeSel}
      </div>
      ${depts.length? `<table class="ledger"><thead><tr><th>部門/組別</th><th>分配${bp.mode==='ratio'?'比例':'金額'}</th><th style="text-align:right">分配金額</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="desc" style="margin-top:8px;">總預算 ${fmt(bp.totalAmount)}，已分配 ${fmt(allocSum)}，${diff===0? '<span style="color:#3f6b52">分配完全一致</span>' : diff>0? `<span style="color:var(--gold)">尚有 ${fmt(diff)} 未分配</span>` : `<span style="color:var(--rose)">超額分配 ${fmt(-diff)}</span>`}</p>`
      : '<div class="empty">請先於「管理中心 → 部門/組別」建立本學期的部門</div>'}
      ${depts.length && canEdit()? `<div class="row-actions"><button class="btn" onclick="saveAllocationToDepartments()">💾 儲存分配為各部門正式預算</button></div>`:''}
      <div class="row-actions">
        <button class="btn gold" onclick="printBudgetDoc('budget')">產生預算書</button>
        <button class="btn primary" onclick="printBudgetDoc('settlement')">產生結算書</button>
      </div>
    </div>
  `;
}
async function bpSetTotal(v){
  if(!guard()) return;
  const n=nonNegativeFiniteNumber(v); if(n===null){ alert('總預算金額不正確'); renderTab(); return; }
  if(!state.budgetPlans[workingSemId]) return;
  state.budgetPlans[workingSemId].totalAmount=n; await sSet('budgetPlans', state.budgetPlans); renderTab();
}
async function bpSetMode(v){
  if(!guard()) return;
  if(v!=='amount' && v!=='ratio'){ alert('預算模式不正確'); renderTab(); return; }
  if(!state.budgetPlans[workingSemId]) return;
  state.budgetPlans[workingSemId].mode=v; await sSet('budgetPlans', state.budgetPlans); renderTab();
}
async function bpSetAlloc(deptId, v){
  if(!guard()) return;
  const n=nonNegativeFiniteNumber(v); if(n===null){ alert('分配金額不正確'); renderTab(); return; }
  if(!state.budgetPlans[workingSemId]) return;
  if(!state.departments.some(d=>d.id===deptId)){ alert('部門不存在'); return; }
  if(state.budgetPlans[workingSemId].mode==='ratio' && n>100){ alert('比例不能超過100%'); renderTab(); return; }
  state.budgetPlans[workingSemId].allocations[deptId]=n; await sSet('budgetPlans', state.budgetPlans); renderTab();
}
async function saveAllocationToDepartments(){
  if(!guard()) return;
  const bp = state.budgetPlans[workingSemId];
  const depts = state.departments.filter(inSemScope);
  depts.forEach(d=>{ const v=bp.allocations[d.id]||0; d.budget = bp.mode==='ratio'? (bp.totalAmount*v/100) : v; });
  await sSet('departments', state.departments);
  alert('已將分配金額儲存為各部門正式預算');
  renderTab();
}
function printBudgetDoc(kind){
  const bp = state.budgetPlans[workingSemId];
  const sem = state.config.semesters.find(s=>s.id===workingSemId);
  const rows = state.departments.filter(inSemScope).map(d=>{
    const v = bp.allocations[d.id]||0;
    const allocated = bp.mode==='ratio'? (bp.totalAmount*v/100) : v;
    const actual = state.transactions.filter(t=>t.type==='支出' && isInternalCounted(t) && deptOf(t)===d.id).reduce((s,t)=>s+t.amount,0);
    if(kind==='budget') return `<tr><td>${escapeHtml(d.name)}</td><td style="text-align:right">${fmt(allocated)}</td></tr>`;
    const variance = allocated-actual;
    return `<tr><td>${escapeHtml(d.name)}</td><td style="text-align:right">${fmt(allocated)}</td><td style="text-align:right">${fmt(actual)}</td><td style="text-align:right;${variance<0?'color:#9c4237':''}">${fmt(variance)}</td></tr>`;
  }).join('');
  const title = kind==='budget'? `${state.config.clubName} 預算書 - ${semLabel(sem)}` : `${state.config.clubName} 結算書 - ${semLabel(sem)}`;
  const header = kind==='budget'? '<tr><th>部門/組別</th><th style="text-align:right">分配預算</th></tr>' : '<tr><th>部門/組別</th><th style="text-align:right">分配預算</th><th style="text-align:right">實際支出</th><th style="text-align:right">賸餘/超支</th></tr>';
  renderPrintDoc(title, `<p>總預算：${fmt(bp.totalAmount)}　學期：${escapeHtml(semLabel(sem))}</p><table style="width:100%;border-collapse:collapse;font-size:13px;" border="1" cellpadding="6"><thead>${header}</thead><tbody>${rows}</tbody></table>`, {includeSig:true, includeSeal: state.signatures.sealDefaultOn});
}

function exportCSV(){
  const list = reportTxList();
  const header = ['日期','類型','大分類','小分類','標籤','發票號碼','專案/活動','部門','經手人','記帳人員','付款方式','付款狀態','入帳/歸墊帳戶','對象','摘要','金額','僅外帳','僅內帳'];
  const lines=[header.join(',')];
  list.forEach(t=>{
    const proj=state.projects.find(p=>p.id===t.projectId); const dept=state.departments.find(d=>d.id===deptOf(t));
    const accLbl = txAccount(t)==='cash'?'現金': txAccount(t)==='bank'?'銀行':'（墊付未歸墊）';
    const statusLbl = {paid:'已支出/已收入', advance:(t.reimbursed?'幹部墊付-已歸墊':'幹部墊付-待歸還'), draw:(t.reimbursed?'幹部借支-已收回':'幹部借支-待收回'), draw_return:'借支收回款'}[t.paymentStatus] || (t.type==='轉帳'?'現金銀行互轉':'');
    // 備註欄是自由輸入文字，可能含換行——CSV 欄位雖然用雙引號包起來理論上
    // 可以放換行，但不少簡易 CSV 工具/編輯器不會正確處理，乾脆換成空白，
    // 避免匯出的檔案在別的程式打開時欄位跑位。
    const cleanNote = (t.note||'').replace(/[\r\n]+/g,' ').replace(/,/g,'，');
    const row=[t.date,t.type,t.category,t.subCategory||'', (t.tags||[]).join('/'), t.invoiceNumber||'', proj?proj.name:'行政/一般', dept?dept.name:'', t.handler||'', t.recordedBy||'', t.method||'', statusLbl, accLbl, t.counterparty||'', cleanNote, t.amount, t.externalOnly?'是':'否', t.internalOnly?'是':'否'];
    lines.push(row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='帳目報表.csv'; a.click(); URL.revokeObjectURL(url);
}
function renderPrintDoc(title, bodyHtml, opts){
  opts = opts||{includeSig:true, includeSeal:false};
  const sig = state.signatures;
  const sigHtml = !opts.includeSig? '' : ['preparer','leader','advisor'].map(key=>{
    const label = (sig.labels && sig.labels[key]) || (key==='preparer'?'製表人':key==='leader'?'社長/負責人':'指導老師');
    // 每個簽名欄位可以選擇列印時要用「手寫簽名」還是「個人印章圖檔」，兩者擇一。
    const useSeal = sig.useSeal && sig.useSeal[key] && sig.seals && sig.seals[key];
    const imgSrc = useSeal? sig.seals[key] : sig[key];
    const img = imgSrc? `<img src="${imgSrc}" style="height:60px">` : `<div style="height:60px"></div>`;
    return `<div style="display:inline-block;margin-right:40px;text-align:center;"><div style="border-bottom:1px solid #333;width:180px;height:64px;display:flex;align-items:flex-end;justify-content:center;">${img}</div><div style="font-size:12px;margin-top:4px;">${escapeHtml(label)}</div></div>`;
  }).join('');
  const sealHtml = (opts.includeSeal && sig.sealDataUrl)? `<img src="${sig.sealDataUrl}" style="position:absolute; top:${sig.sealTop}%; left:${sig.sealLeft}%; width:${sig.sealSize}px; opacity:0.9;">` : '';
  const footerHtml = state.config.printFooter? `<div style="margin-top:40px;padding-top:10px;border-top:1px solid #ccc;font-size:11px;color:#777;white-space:pre-line;">${escapeHtml(state.config.printFooter)}</div>` : '';
  document.getElementById('printArea').innerHTML = `
    <div style="font-family:var(--font-heading);color:#1f2a24;position:relative;min-height:600px;">
      ${state.config.logoDataUrl? `<img src="${state.config.logoDataUrl}" style="height:44px;margin-bottom:6px;">` : ''}
      <h1 style="font-size:20px;border-bottom:2px solid #1f2a24;padding-bottom:8px;">${escapeHtml(title)}</h1>
      <p style="font-size:12px;color:#555;">產生日期：${new Date().toLocaleDateString('zh-Hant-TW')}</p>
      <div style="font-family:var(--font-body);">${bodyHtml}</div>
      ${sigHtml? `<div style="margin-top:50px;">${sigHtml}</div>` : ''}
      ${sealHtml}
      ${footerHtml}
    </div>`;
  setTimeout(()=>window.print(), 100);
}

function computeSemesterForDate(dateStr){
  const d = new Date(dateStr+'T00:00:00'); const y=d.getFullYear(); const mo=d.getMonth()+1;
  if(mo>=8) return { rocYear:y-1911, half:1 };
  if(mo===1) return { rocYear:y-1912, half:1 };
  return { rocYear:y-1912, half:2 };
}
function buildSemesterObj(rocYear, half){
  const gy = rocYear+1911;
  if(half===1) return { id:uid(), shortCode:`${rocYear}-1`, name:`${rocYear}學年度第一學期`, start:`${gy}-08-01`, end:`${gy+1}-01-31` };
  return { id:uid(), shortCode:`${rocYear}-2`, name:`${rocYear}學年度第二學期`, start:`${gy+1}-02-01`, end:`${gy+1}-07-31` };
}
async function addNextSemester(){
  if(!canOpenSettings()) return;
  let next;
  if(state.config.semesters.length===0){
    const {rocYear, half} = computeSemesterForDate(todayStr());
    next = buildSemesterObj(rocYear, half);
  } else {
    const sorted = [...state.config.semesters].sort((a,b)=> a.start.localeCompare(b.start));
    const last = sorted[sorted.length-1];
    const m = (last.shortCode||'').match(/^(\d+)-(1|2)$/);
    let rocYear, half;
    if(m){ rocYear=parseInt(m[1]); half=parseInt(m[2]); } else { const c=computeSemesterForDate(last.start); rocYear=c.rocYear; half=c.half; }
    half += 1; if(half>2){ half=1; rocYear+=1; }
    next = buildSemesterObj(rocYear, half);
  }
  if(state.config.semesters.some(s=>s.shortCode===next.shortCode)){ if(!confirm('已存在相同簡稱的學期，仍要新增（可能重複）？')) return; }
  state.config.semesters.push(next);
  await sSet('config', state.config);
  alert(`已新增：${next.shortCode}（${next.start}~${next.end}）`);
  renderTab();
}

async function saveAdminAccount(id){
  if(!isAdmin()) return;
  const name = document.getElementById('adminAccName').value.trim();
  const user = document.getElementById('adminAccUser').value.trim();
  const pw = document.getElementById('adminAccPw').value;
  if(!name || !user){ alert('請輸入姓名與帳號'); return; }
  if(!id && pw.length<MIN_PASSWORD_LENGTH){ alert(`新帳號密碼至少${MIN_PASSWORD_LENGTH}碼`); return; }
  if(id && pw && pw.length<MIN_PASSWORD_LENGTH){ alert(`新密碼至少${MIN_PASSWORD_LENGTH}碼`); return; }
  if(adminAccounts.some(a=>a.username===user && a.id!==id)){ alert('此登入帳號已被使用'); return; }
  let data = { displayName:name, username:user, role:'管理員', canEdit:true, canReimburse:true, canViewInternal:true, allowedTabs:[...ALL_TAB_IDS] };
  if(pw){ data.passwordHash = await hashPw(pw); }
  if(id){ const idx = adminAccounts.findIndex(a=>a.id===id); adminAccounts[idx] = {...adminAccounts[idx], ...data}; }
  else adminAccounts.push({ id: uid(), ...data });
  await saveAdminAccounts();
  closeModal(); renderTab();
}
async function deleteAdminAccount(id){
  if(!isAdmin()) return;
  if(adminAccounts.length<=1){ alert('至少須保留一位帳冊管理員帳號'); return; }
  if(!confirm('確定刪除此管理員帳號？刪除後將無法再用這組帳號密碼登入任何帳本。')) return;
  adminAccounts = adminAccounts.filter(a=>a.id!==id);
  await saveAdminAccounts(); renderTab();
}

  const box = document.getElementById('backupResult');

  const r = await window.pywebview.api.save_backup_file();
  box.innerHTML = r.ok
    ? `<p class="desc" style="color:#3f6b52;">已匯出備份檔：${escapeHtml(r.path)}</p>`
    : (r.message==='已取消'? '' : `<p class="desc" style="color:var(--rose);">匯出失敗：${escapeHtml(r.message||'')}</p>`);
}
async function doLoadBackup(mode){
  if(!canOpenSettings()) return;
  if(mode!=='merge' && mode!=='replace'){ alert('還原模式不正確'); return; }
  if(mode==='replace' && !confirm('這會清空目前帳本的「所有」資料，改用備份檔內容取代，此操作無法復原，確定要繼續嗎？')) return;
  const box = document.getElementById('backupResult');
  box.innerHTML = '<p class="desc">請在跳出的選檔視窗中選擇備份檔...</p>';
  const r = await window.pywebview.api.load_backup_file(mode);
  if(!r.ok){
    box.innerHTML = r.message==='已取消'? '' : `<p class="desc" style="color:var(--rose);">還原失敗：${escapeHtml(r.message||'')}</p>`;
    return;
  }
  box.innerHTML = `<p class="desc" style="color:#3f6b52;">已還原 ${r.key_count} 筆資料項目，正在重新整理畫面...</p>`;
  setTimeout(()=> window.location.reload(), 800);
}

let _mobileImportPreview = null; // 存目前預覽畫面的完整結果，避免把資料塞進 onclick 字串（note 欄位可能含引號等特殊字元，塞進 HTML 屬性容易壞掉）
function renderMobileImportPreview(r){
  _mobileImportPreview = r;
  const entries = r.entries||[]; const errors = r.errors||[];
  if(entries.length===0 && errors.length===0){
    showModal(`<h3 class="serif">匯入手機記錄</h3><p class="desc">目前沒有尚未匯入的手機記帳資料（累計已處理 ${r.already_imported} 筆，暫存表目前共 ${r.total_rows} 列）。</p><div class="row-actions"><button class="btn" onclick="closeModal()">關閉</button></div>`);
    return;
  }
  const rows = entries.map(e=>`<tr>
      <td>${e.row_no}</td><td>${escapeHtml(e.date)}</td><td>${escapeHtml(e.type)}</td>
      <td style="text-align:right;">${fmt(e.amount)}</td><td>${escapeHtml(e.category)}</td>
      <td>${escapeHtml(e.note||'')}</td><td>${escapeHtml(e.handler||'')}</td>
    </tr>`).join('');
  // 「算不算處理過」現在是用這一列的內容雜湊值判斷（見後端 _mobile_row_hash），
  // 不是看它排在表格第幾列，所以：
  //  - 直接刪除這一列是安全的，不會讓後面其他列的匯入狀態跟著錯亂
  //  - 如果去試算表把內容訂正好，內容變了、雜湊值也會跟著變，下次「匯入
  //    手機記錄」會把它當成新的一筆重新抓到（不會因為訂正過就永遠撈不到）
  const errRows = errors.map(e=>`<li>第 ${e.row_no} 列：${escapeHtml(e.message)}（這次會跳過，不影響其他列；如果要讓它被匯入，請到試算表把內容訂正好，下次「匯入手機記錄」會重新抓到；不需要這筆的話也可以直接刪除這一列）</li>`).join('');
  const html = `
    <h3 class="serif">匯入手機記錄</h3>
    <p class="desc">找到 <b>${entries.length}</b> 筆新的手機記帳資料待確認。<b>確認匯入前會先自動備份目前的帳本</b>。雲端暫存表不會被程式清空或修改；匯入狀態是依每一列的「內容」判斷，所以您事後要刪除已匯入的列、整理順序，或訂正錯誤列的內容，都可以放心操作，不會打亂其他列的匯入狀態。</p>
    ${entries.length? `<div style="max-height:260px;overflow:auto;border:1px solid var(--paper-line);">
      <table class="tbl"><thead><tr><th>列</th><th>日期</th><th>收支</th><th>金額</th><th>類別</th><th>備註</th><th>記錄人</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>` : ''}
    ${errRows? `<p class="desc" style="color:var(--rose);margin-top:10px;">以下 ${errors.length} 列格式有問題：</p><ul class="desc" style="color:var(--rose);">${errRows}</ul>` : ''}
    <div class="row-actions" style="margin-top:12px;">
      ${entries.length? `<button class="btn primary" onclick="confirmMobileImport()">✅ 確認匯入 ${entries.length} 筆</button>` : ''}
      <button class="btn" onclick="closeModal()">取消</button>
    </div>`;
  showModal(html);
}
async function confirmMobileImport(){
  if(!guard()) return;
  const preview = _mobileImportPreview;
  if(!preview){ alert('預覽資料已失效，請重新點「匯入手機記錄」'); return; }
  const entries = preview.entries||[];
  const backupResult = await window.pywebview.api.auto_backup_before_mobile_import();
  if(!backupResult.ok){
    alert(`自動備份失敗，為了安全起見已取消匯入：${backupResult.message||'未知錯誤'}`);
    return;
  }
  // 第二道防線：匯入狀態現在是用「內容雜湊值」判斷（見後端 _mobile_row_hash），
  // 已經不怕使用者事後刪除/排序/插入列造成位置錯位；這裡再加一層獨立的保險——
  // 用「日期+類型+金額+類別+備註+記錄人」組成特徵值，比對已存在、同樣標記
  // 「手機匯入」的交易，命中的話視為重複，不會再匯入第二筆，但仍會把這筆標記
  // 為已處理（因為使用者已經在預覽畫面確認過這筆）。
  const existingSignatures = new Set(
    state.transactions.filter(t=> (t.tags||[]).includes('手機匯入'))
      .map(t=> [t.date, t.type, t.amount, t.category, t.note||'', t.handler||''].join('\u0001'))
  );
  let importedCount = 0, dupCount = 0;
  entries.forEach(e=>{
    const sig = [e.date, e.type, e.amount, e.category, e.note||'', e.handler||''].join('\u0001');
    if(existingSignatures.has(sig)){ dupCount++; return; }
    existingSignatures.add(sig);
    state.transactions.push({
      id: uid(), type:e.type, date:e.date, category:e.category, subCategory:'',
      amount:e.amount, projectId:null, departmentId:null, method:'現金', account:'cash',
      handler:e.handler||'', counterparty:'', tags:['手機匯入'], invoiceNumber:'',
      note: e.note||'', externalOnly:false, internalOnly:false, paymentStatus:'paid',
      reimbursed:false, reimburseDate:null, reimburseAccount:null,
      recordedBy: (currentAccount? currentAccount.displayName : '') + '（手機匯入）'
    });
    importedCount++;
  });
  await sSet('transactions', state.transactions);
  // 把這次預覽畫面上出現過的「每一列」（entries 裡成功解析的，加上 errors
  // 裡格式有問題而跳過的）各自的內容雜湊值都送回去標記成已處理，使用者
  // 親眼確認過的每一列都算數，理由詳見 Python 端 confirm_mobile_import 的
  // 註解。sheetId/sheetName 一併帶上，只有在偵測到舊版「純數字」格式的
  // marker 需要升級時才會用到。
  const allRowHashes = [...entries.map(e=>e.row_hash), ...(preview.errors||[]).map(e=>e.row_hash)].filter(Boolean);
  await window.pywebview.api.confirm_mobile_import(allRowHashes, state.config.mobileStaging.sheetId, state.config.mobileStaging.sheetName || '表單回應 1');
  state.config.mobileStaging.lastBackupTime = backupResult.time;
  await sSet('config', state.config);
  _mobileImportPreview = null;
  closeModal();
  // 原本這裡不管實際匯入結果，固定顯示「已成功匯入 entries.length 筆」，
  // 但 entries.length 是「預覽當下有幾筆」，不是「真的新增了幾筆」——如果其中
  // 有幾筆跟既有交易的特徵值重複（見上面 existingSignatures 比對）而被跳過，
  // 使用者會被這句話誤導成「全部都成功匯入了」，不知道其實有被擋下來的重複
  // 資料。改成依實際結果分情況顯示。
  if(dupCount>0){
    alert(`已匯入 ${importedCount} 筆手機記帳資料；另外 ${dupCount} 筆因為跟既有交易內容重複（日期/類型/金額/類別/備註/記錄人皆相同），已自動跳過、未重複新增。`);
  } else {
    alert(`已成功匯入 ${importedCount} 筆手機記帳資料。`);
  }
  renderTab();
}

function handleLogoUpload(input){
  if(!canOpenSettings() || !isFeatureAllowed('style')) return;
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload=()=>{
      const size=160; const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d'); const scale=Math.min(size/img.width, size/img.height);
      const w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      state.config.logoDataUrl = canvas.toDataURL('image/png');
      sSet('config', state.config).then(()=>{ applyTheme(); renderTab(); });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);

function setupSigCanvas(key){
  const canvas = document.getElementById('sig_'+key); if(!canvas) return;
  const ctx = canvas.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#1f2a24';
  if(state.signatures[key]){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src=state.signatures[key]; }
  let drawing=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const cx=canvas.width/r.width, cy=canvas.height/r.height; const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*cx, y:(p.clientY-r.top)*cy}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.onmousedown=start; canvas.onmousemove=move; window.addEventListener('mouseup',end);
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
